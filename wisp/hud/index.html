<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisp OS</title>
<style>
  :root{
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222220;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --hairline:rgba(255,255,255,0.10); --grid:#2c2c2a;
    --accent:#3987e5; --accent-2:#9085e9;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--page); color:var(--ink-2);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  ::selection{background:rgba(57,135,229,.35)}

  header{
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    border-bottom:1px solid var(--hairline); flex:none;
  }
  header .logo{color:var(--ink); font-weight:700; letter-spacing:.14em}
  header .logo span{color:var(--accent)}
  .badge{
    font-size:11px; padding:2px 8px; border:1px solid var(--hairline);
    border-radius:999px; color:var(--ink-3);
  }
  .badge.engine-claude{color:var(--good); border-color:rgba(12,163,12,.4)}
  header .clock{margin-left:auto; color:var(--ink-3); font-variant-numeric:tabular-nums}

  main{
    flex:1; display:grid; grid-template-columns:270px 1fr 300px;
    gap:14px; padding:14px 18px; min-height:0;
  }
  .col{display:flex; flex-direction:column; gap:14px; min-height:0; overflow-y:auto}
  .col::-webkit-scrollbar{width:6px}
  .col::-webkit-scrollbar-thumb{background:var(--grid); border-radius:3px}

  .panel{
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:var(--radius); padding:12px 14px; flex:none;
  }
  .panel h2{
    margin:0 0 10px; font-size:11px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-3);
  }

  /* vitals */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .tile{background:var(--surface-2); border-radius:8px; padding:8px 10px}
  .tile .v{color:var(--ink); font-size:20px; font-weight:650}
  .tile .k{font-size:11px; color:var(--ink-3)}
  .tile .v small{font-size:12px; color:var(--ink-2); font-weight:400}

  /* lists */
  ul.plain{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
  .directive{display:flex; gap:8px}
  .directive .n{color:var(--accent); font-weight:650; font-variant-numeric:tabular-nums}
  .sched{display:flex; gap:10px}
  .sched .t{color:var(--ink-3); font-variant-numeric:tabular-nums; flex:none}
  .trail li{font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .trail li b{color:var(--ink-2); font-weight:500}

  /* center */
  #center{display:flex; flex-direction:column; min-height:0}
  #orbwrap{position:relative; flex:none; display:flex; justify-content:center; padding:6px 0 0}
  #orb{display:block}
  #assistant-line{
    text-align:center; min-height:44px; color:var(--ink); font-size:15px;
    padding:4px 32px 0; flex:none;
  }
  #assistant-line .whisper{color:var(--ink-3); font-size:13px}
  #meter{display:flex; gap:3px; justify-content:center; align-items:flex-end; height:26px; padding:8px 0; flex:none}
  #meter i{width:4px; background:var(--accent); border-radius:2px; height:4px; transition:height .12s}

  #feed{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:8px 40px; min-height:0}
  .msg{max-width:75%; padding:8px 12px; border-radius:10px; font-size:13.5px}
  .msg.you{align-self:flex-end; background:rgba(57,135,229,.16); color:var(--ink)}
  .msg.wisp{align-self:flex-start; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--hairline)}
  .msg.wisp a{color:var(--accent); text-decoration:none}

  #sayrow{display:flex; gap:8px; padding:10px 40px 4px; flex:none}
  #say{
    flex:1; background:var(--surface); color:var(--ink);
    border:1px solid var(--hairline); border-radius:999px; padding:10px 16px;
    font:inherit; outline:none;
  }
  #say:focus{border-color:rgba(57,135,229,.5)}
  #sayrow button{
    background:var(--accent); color:#fff; border:0; border-radius:999px;
    padding:0 18px; font:inherit; font-weight:600; cursor:pointer;
  }

  /* skills */
  .skillgroup{margin-bottom:10px}
  .skillgroup .g{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin:2px 0 6px}
  .skills{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  button.skill{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    background:var(--surface-2); border:1px solid var(--hairline); border-radius:8px;
    color:var(--ink-2); padding:8px 10px; font:inherit; font-size:12.5px;
    cursor:pointer; text-align:left;
  }
  button.skill:hover{border-color:rgba(57,135,229,.55); color:var(--ink)}
  button.skill .ic{font-size:15px}
  button.skill .nm{font-weight:600; color:var(--ink)}

  /* jobs */
  .job{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--grid)}
  .job:last-child{border-bottom:0}
  .job .st{flex:none; font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid var(--hairline)}
  .st.queued{color:var(--ink-3)}
  .st.running{color:var(--warn); border-color:rgba(250,178,25,.45)}
  .st.done{color:var(--good); border-color:rgba(12,163,12,.45)}
  .st.error{color:var(--crit); border-color:rgba(208,59,59,.5)}
  .job .nm{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .job .open{margin-left:auto; background:none; border:0; color:var(--accent); cursor:pointer; font:inherit; font-size:12px}
  .job.running-anim .st::before{content:"◌ "; animation:spin 1s linear infinite; display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* reports list */
  .report-row{display:flex; gap:8px; align-items:baseline; padding:4px 0; cursor:pointer}
  .report-row:hover .ttl{color:var(--accent)}
  .report-row .ttl{color:var(--ink); font-size:13px}
  .report-row .sk{font-size:11px; color:var(--ink-3); margin-left:auto; flex:none}

  /* overlay */
  #overlay{
    position:fixed; inset:0; background:rgba(13,13,13,.72); display:none;
    align-items:center; justify-content:center; padding:5vh 5vw; z-index:50;
  }
  #overlay.show{display:flex}
  #popup{
    background:var(--surface); border:1px solid var(--hairline); border-radius:12px;
    max-width:780px; width:100%; max-height:88vh; display:flex; flex-direction:column;
  }
  #popup header{border-bottom:1px solid var(--hairline); padding:12px 18px}
  #popup header .t{color:var(--ink); font-weight:650}
  #popup header .m{font-size:12px; color:var(--ink-3)}
  #popup header button{margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:18px; cursor:pointer}
  #popup .body{padding:8px 22px 18px; overflow-y:auto; color:var(--ink-2)}
  .body h1,.body h2,.body h3{color:var(--ink)}
  .body h1{font-size:19px} .body h2{font-size:15px; margin-top:18px}
  .body code{background:var(--surface-2); padding:1px 5px; border-radius:4px; font-size:12.5px}
  .body pre{background:var(--page); border:1px solid var(--grid); border-radius:8px; padding:10px 12px; overflow-x:auto; font-size:12.5px}
  .body pre code{background:none; padding:0}
  .body table{border-collapse:collapse; font-variant-numeric:tabular-nums}
  .body th,.body td{border:1px solid var(--grid); padding:4px 10px; font-size:13px}
  .body a{color:var(--accent)}

  /* toasts */
  #toasts{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:60}
  .toast{
    background:var(--surface-2); border:1px solid var(--hairline); border-left:3px solid var(--accent);
    border-radius:8px; padding:10px 14px; max-width:340px; font-size:13px; color:var(--ink);
    cursor:pointer; animation:rise .25s ease-out;
  }
  .toast.err{border-left-color:var(--crit)}
  .toast .sub{color:var(--ink-3); font-size:12px}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1}}
</style>
</head>
<body>
<header>
  <div class="logo">W<span>I</span>SP&nbsp;OS</div>
  <div class="badge" id="engine">engine: …</div>
  <div class="badge" id="version">v…</div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <!-- left: vitals / directives / schedule / trail -->
  <div class="col">
    <div class="panel">
      <h2>Vitals</h2>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="panel">
      <h2>Directives</h2>
      <ul class="plain" id="directives"></ul>
    </div>
    <div class="panel">
      <h2>Schedule</h2>
      <ul class="plain" id="schedule"></ul>
    </div>
    <div class="panel">
      <h2>Document trail</h2>
      <ul class="plain trail" id="trail"></ul>
    </div>
  </div>

  <!-- center: orb + conversation -->
  <div class="col" id="center">
    <div id="orbwrap"><canvas id="orb" width="240" height="240"></canvas></div>
    <div id="meter"></div>
    <div id="assistant-line"><span class="whisper">Ask Wisp anything, or press a skill.</span></div>
    <div id="feed"></div>
    <form id="sayrow">
      <input id="say" placeholder="Say something… e.g. “give me the rundown”" autocomplete="off">
      <button>Send</button>
    </form>
  </div>

  <!-- right: skills + jobs + reports -->
  <div class="col">
    <div class="panel">
      <h2>Skills</h2>
      <div id="skillgroups"></div>
    </div>
    <div class="panel">
      <h2>Jobs</h2>
      <div id="jobs"></div>
    </div>
    <div class="panel">
      <h2>Recent reports</h2>
      <div id="reports"></div>
    </div>
  </div>
</main>

<div id="overlay">
  <div id="popup">
    <header style="display:flex;align-items:center;gap:12px">
      <div><div class="t" id="p-title">Report</div><div class="m" id="p-meta"></div></div>
      <button onclick="closePopup()">✕</button>
    </header>
    <div class="body" id="p-body"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
let state = null;

/* ---------- orb ---------- */
const orb = $('#orb').getContext('2d');
let energy = 0.15;             // rises while jobs run / messages arrive
function drawOrb(t){
  const c = orb, W = 240, H = 240, cx = W/2, cy = H/2;
  c.clearRect(0,0,W,H);
  const base = 62, n = 90;
  for(let ring=0; ring<3; ring++){
    c.beginPath();
    for(let i=0;i<=n;i++){
      const a = i/n*Math.PI*2;
      const wob = Math.sin(a*(3+ring)+t/(500-ring*120))*(3+energy*14)
                + Math.sin(a*7-t/700)*(1.5+energy*6);
      const r = base + ring*14 + wob;
      const x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
      i?c.lineTo(x,y):c.moveTo(x,y);
    }
    c.closePath();
    c.strokeStyle = ring===0? 'rgba(57,135,229,.85)' : ring===1? 'rgba(144,133,233,.4)' : 'rgba(57,135,229,.18)';
    c.lineWidth = ring===0?2:1;
    c.stroke();
  }
  const g = c.createRadialGradient(cx,cy,6,cx,cy,base);
  g.addColorStop(0,'rgba(57,135,229,'+(0.32+energy*0.5)+')');
  g.addColorStop(1,'rgba(57,135,229,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(cx,cy,base,0,Math.PI*2); c.fill();
  energy = Math.max(0.15, energy*0.995);
  requestAnimationFrame(drawOrb);
}
requestAnimationFrame(drawOrb);

/* ---------- audio meter (activity-driven) ---------- */
const meter = $('#meter');
for(let i=0;i<28;i++) meter.appendChild(document.createElement('i'));
setInterval(()=>{
  [...meter.children].forEach((b,i)=>{
    const h = 4 + Math.max(0, Math.sin(Date.now()/130+i)*energy*36 + Math.random()*energy*22);
    b.style.height = h.toFixed(0)+'px';
  });
}, 120);

/* ---------- state ---------- */
async function refresh(){
  try{
    state = await (await fetch('/api/state')).json();
  }catch(e){ return; }
  $('#version').textContent = 'v'+state.version;
  const eng = $('#engine');
  eng.textContent = 'engine: '+state.engine;
  eng.className = 'badge engine-'+state.engine;

  const v = state.vitals;
  $('#tiles').innerHTML = [
    ['branch', `<small>${esc(v.branch)}</small>`],
    ['runs today', v.runs_today],
    ['commits · wk', `${v.commits_today}<small> · ${v.commits_week}</small>`],
    ['uncommitted', v.uncommitted],
    ['vault notes', v.vault_notes],
    ['inbox', v.inbox],
  ].map(([k,val])=>`<div class="tile"><div class="v">${val}</div><div class="k">${k}</div></div>`).join('');

  $('#directives').innerHTML = (state.directives.length?state.directives:['— none set — run daily-review'])
    .map((d,i)=>`<li class="directive"><span class="n">${i+1}</span><span>${esc(d)}</span></li>`).join('');

  $('#schedule').innerHTML = (state.schedule.length?state.schedule:[{time:'—',item:'nothing scheduled'}])
    .map(s=>`<li class="sched"><span class="t">${esc(s.time)}</span><span>${esc(s.item)}</span></li>`).join('');

  $('#trail').innerHTML = state.trail.map(t=>
    `<li title="${esc(t.note)}"><b>${esc(t.note.split('/').pop())}</b> · ${esc(t.action)} · ${esc(t.ts.slice(11,16))}</li>`
  ).join('') || '<li>—</li>';

  renderSkills(state.skills);
  state.jobs.forEach(upsertJob);

  $('#reports').innerHTML = state.reports.map(r=>
    `<div class="report-row" onclick="openReport('${esc(r.name)}')">
       <span class="ttl">${esc(r.title)}</span><span class="sk">${esc(r.skill)}</span></div>`
  ).join('') || '—';
}

function renderSkills(skills){
  const groups = {};
  skills.forEach(s=>{ (groups[s.group] ||= []).push(s); });
  $('#skillgroups').innerHTML = Object.entries(groups).map(([g,list])=>
    `<div class="skillgroup"><div class="g">${esc(g)}</div><div class="skills">`+
    list.map(s=>`<button class="skill" title="${esc(s.description)}" onclick="runSkill('${esc(s.name)}')">
        <span class="ic">${esc(s.icon)}</span><span class="nm">${esc(s.name)}</span></button>`).join('')+
    `</div></div>`).join('');
}

/* ---------- jobs ---------- */
const jobRows = new Map();
function upsertJob(j){
  let row = jobRows.get(j.id);
  if(!row){
    row = document.createElement('div');
    jobRows.set(j.id, row);
    $('#jobs').prepend(row);
  }
  row.className = 'job' + (j.status==='running' ? ' running-anim' : '');
  const icon = {queued:'…', running:'▶', done:'✓', error:'✕'}[j.status] || '';
  row.innerHTML = `<span class="st ${j.status}">${icon} ${j.status}</span>
    <span class="nm">${esc(j.skill)}</span>` +
    (j.report ? `<button class="open" onclick="openReport('${esc(j.report)}')">open</button>` : '');
}

async function runSkill(name){
  energy = Math.min(1, energy+0.5);
  await fetch(`/api/skills/${encodeURIComponent(name)}/run`, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
}

/* ---------- say ---------- */
$('#sayrow').addEventListener('submit', async e=>{
  e.preventDefault();
  const text = $('#say').value.trim();
  if(!text) return;
  $('#say').value = '';
  addMsg('you', text);
  energy = Math.min(1, energy+0.45);
  const res = await (await fetch('/api/say', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})})).json();
  if(res.reply){
    addMsg('wisp', res.reply);
    line(res.reply);
  }else{
    const d = res.decision;
    line(`Routing to <b>${esc(d.skill)}</b> (${esc(d.engine)})…`);
  }
});

function addMsg(who, text){
  const div = document.createElement('div');
  div.className = 'msg '+who;
  div.textContent = text;
  $('#feed').appendChild(div);
  $('#feed').scrollTop = 1e9;
}
function line(html){ $('#assistant-line').innerHTML = html; }

/* ---------- SSE ---------- */
function listen(){
  const es = new EventSource('/api/events');
  es.onmessage = ev=>{
    const j = JSON.parse(ev.data);
    if(j.kind!=='job') return;
    upsertJob(j);
    energy = Math.min(1, energy+0.3);
    if(j.status==='done'){
      line(esc(j.summary));
      addMsg('wisp', j.summary);
      toast(j.skill+' — done', j.summary, ()=> j.report && openReport(j.report), false);
      refresh();
    }else if(j.status==='error'){
      toast(j.skill+' — failed', j.summary, ()=> j.report && openReport(j.report), true);
    }
  };
  es.onerror = ()=>{ es.close(); setTimeout(listen, 3000); };
}

/* ---------- report popup ---------- */
async function openReport(name){
  const res = await fetch('/api/reports/'+encodeURIComponent(name));
  if(!res.ok) return;
  const {meta, body} = await res.json();
  $('#p-title').textContent = meta.title || name;
  $('#p-meta').textContent = [meta.date, meta.skill && 'skill: '+meta.skill, meta.engine && 'engine: '+meta.engine].filter(Boolean).join(' · ');
  $('#p-body').innerHTML = md(body);
  $('#overlay').classList.add('show');
}
function closePopup(){ $('#overlay').classList.remove('show'); }
document.addEventListener('click', e=>{
  const link = e.target.closest('a.wikilink');
  if(link) openReport(link.dataset.note.split('/').pop());
});
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closePopup(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePopup(); });

/* ---------- toasts ---------- */
function toast(title, sub, onclick, isErr){
  const t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.innerHTML = `<div>${esc(title)}</div><div class="sub">${esc(sub||'')}</div>`;
  t.onclick = ()=>{ onclick && onclick(); t.remove(); };
  $('#toasts').appendChild(t);
  setTimeout(()=>t.remove(), 9000);
}

/* ---------- tiny markdown (escape first, then transform) ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(src){
  const lines = esc(src).split('\n');
  let out = [], inCode = false, inList = false, inTable = false;
  const closeAll = ()=>{ if(inList){out.push('</ul>'); inList=false;} if(inTable){out.push('</table>'); inTable=false;} };
  for(const raw of lines){
    if(raw.startsWith('```')){ closeAll(); out.push(inCode?'</code></pre>':'<pre><code>'); inCode=!inCode; continue; }
    if(inCode){ out.push(raw); continue; }
    let l = raw
      .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '<a class="wikilink" data-note="$1">$2</a>')
      .replace(/\[\[([^\]]+)\]\]/g, '<a class="wikilink" data-note="$1">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
    if(/^\|/.test(l)){
      if(!inTable){ closeAll(); out.push('<table>'); inTable = true; }
      if(/^\|[\s\-|]+\|$/.test(l)) continue;
      out.push('<tr>'+l.split('|').slice(1,-1).map(c=>'<td>'+c.trim()+'</td>').join('')+'</tr>');
      continue;
    }
    if(inTable){ out.push('</table>'); inTable=false; }
    if(/^#{1,3}\s/.test(l)){ closeAll(); const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${l.replace(/^#+\s*/,'')}</h${n}>`); continue; }
    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l)){
      if(!inList){ out.push('<ul>'); inList = true; }
      out.push('<li>'+l.replace(/^\s*(?:[-*]|\d+\.)\s+/,'')+'</li>'); continue;
    }
    if(inList && l.trim()===''){ out.push('</ul>'); inList = false; continue; }
    out.push(l.trim()===''?'':'<p>'+l+'</p>');
  }
  closeAll();
  if(inCode) out.push('</code></pre>');
  return out.join('\n');
}

/* ---------- clock ---------- */
setInterval(()=>{ $('#clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }, 1000);

refresh();
listen();
setInterval(refresh, 30000);
</script>
</body>
</html>

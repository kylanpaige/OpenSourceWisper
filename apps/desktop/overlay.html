<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recording</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      #pill {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px;
        padding: 10px 18px;
        border-radius: 24px;
        background: rgba(20, 20, 28, 0.92);
        color: #fff;
        font-size: 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      }
      #dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff5252;
        transition: transform 80ms linear;
      }
      .pulse {
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </head>
  <body>
    <div id="pill">
      <div id="dot" class="pulse"></div>
      <span id="label">Listening…</span>
    </div>
    <script type="module">
      import { listen } from "@tauri-apps/api/event";
      const label = document.getElementById("label");
      const dot = document.getElementById("dot");
      const names = {
        recording: "Listening…",
        transcribing: "Transcribing…",
        cleaning: "Polishing…",
        injecting: "Inserting…",
        idle: "",
      };
      listen("dictation-phase", (e) => {
        const phase = e.payload;
        label.textContent = names[phase] ?? phase;
        dot.style.background = phase === "recording" ? "#ff5252" : "#ffb300";
        dot.classList.toggle("pulse", phase === "recording");
      });
      listen("audio-level", (e) => {
        const level = Math.min(1, e.payload * 14);
        dot.style.transform = `scale(${1 + level * 1.6})`;
      });
    </script>
  </body>
</html>

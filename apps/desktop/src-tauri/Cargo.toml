[package]
name = "opensourcewisper"
description = "OpenSourceWisper — fully local voice dictation (Wispr Flow clone) for macOS and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "opensourcewisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wisper-core = { path = "../../../crates/wisper-core" }
# macos-private-api unlocks transparent windows on macOS (used by the
# recording overlay); it is a no-op on Windows/Linux.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
cpal = "0.16"
whisper-rs = "0.14"
enigo = "0.5"
arboard = "3"
active-win-pos-rs = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }

[features]
# Opt-in NVIDIA acceleration for Windows/Linux builds with the CUDA toolkit installed.
cuda = ["whisper-rs/cuda"]
